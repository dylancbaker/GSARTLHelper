name: Build and Deploy on Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to build and deploy'
        required: true
        type: string

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        run: dotnet publish GSARTLHelper/GSARTLHelper.csproj --configuration Release --output ./publish --no-build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gsartl-build
          path: ./publish
          retention-days: 1

      - name: Attach deployment archive to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: |
          tar -czf "$RUNNER_TEMP/gsartl-build.tar.gz" -C ./publish .
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/gsartl-build.tar.gz" --clobber

      - name: Deploy to Ubuntu server
        uses: appleboy/ssh-action@master
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SERVICE_NAME: ${{ secrets.SERVICE_NAME }}
          RELEASE_DOWNLOAD_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ inputs.release_tag || github.event.release.tag_name }}/gsartl-build.tar.gz
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_PATH,SERVICE_NAME,RELEASE_DOWNLOAD_URL
          script: |
            set -e
            echo "Deploying GSARTLHelper..."

            # Verify directory access before backing up or downloading
            if [ ! -d "$DEPLOY_PATH" ] || [ ! -w "$DEPLOY_PATH" ] || [ ! -x "$DEPLOY_PATH" ]; then
              echo "Error: DEPLOY_PATH must be a directory writable and searchable by the DEPLOY_USER SSH account." >&2
              echo "Have a server administrator create it and assign ownership to DEPLOY_USER (see DEPLOYMENT_SETUP.md, Create Deployment Directory)." >&2
              exit 1
            fi

            # Create backup of current deployment
            if [ -d "$DEPLOY_PATH" ]; then
              echo "Backing up current deployment..."
              BACKUP_DIR=$(mktemp -d "$HOME/gsartl-backup-XXXXXXXX")
              cp -r "$DEPLOY_PATH" "$BACKUP_DIR/application"
            fi

            # Download and extract the build artifact
            echo "Downloading build artifact..."
            ARTIFACT_DIR=$(mktemp -d)
            trap 'rm -rf "$ARTIFACT_DIR"' EXIT
            wget -O "$ARTIFACT_DIR/gsartl-build.tar.gz" "$RELEASE_DOWNLOAD_URL"

            # Extract to deployment directory
            echo "Extracting to deployment directory..."
            tar --no-overwrite-dir -xzf "$ARTIFACT_DIR/gsartl-build.tar.gz" -C "$DEPLOY_PATH"

            # Set proper permissions
            chmod +x "$DEPLOY_PATH/GSARTLHelper"

            # Restart the service
            echo "Restarting service..."
            sudo -n systemctl restart "$SERVICE_NAME"

            echo "Deployment complete!"

      - name: Verify deployment
        uses: appleboy/ssh-action@master
        env:
          SERVICE_NAME: ${{ secrets.SERVICE_NAME }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: SERVICE_NAME
          script: |
            echo "Checking service status..."
            if ! sudo -n systemctl status "$SERVICE_NAME"; then
              echo "Error: The deployed service is not running. Check the systemd status output above." >&2
              echo "For status=203/EXEC or a missing /usr/bin/dotnet, have a server administrator follow DEPLOYMENT_SETUP.md (Service Fails to Start)." >&2
              exit 1
            fi
